[pytest]
testpaths = tests
# Repo root on sys.path so `common`, `ml.preprocess` and `services.<svc>.<module>`
# import the same way they do inside the containers (where /srv/reaped/common,
# /ml and /app are bind-mounts). Requires pytest >= 7.
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
